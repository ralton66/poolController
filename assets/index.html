<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoolController</title>
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <h1 class="arduino-text">PoolController</h1>
            <img class="arduino-logo" src="./img/RGB-Arduino-Logo_Color Inline Loop.svg" alt="Arduino Logo">
        </header>

        <section class="status-bar" id="connection-bar">
            <span id="connection-text">Connecting…</span>
            
        </section>

        <main class="dashboard">
             <section class="card readings">
                <h2>Temperatures</h2>
                <div class="grid">
                    <div class="metric">
                        <span class="label">Air</span>
                        <span class="value" id="air-temp">—</span>
                    </div>
                    <div class="metric">
                        <span class="label">Pool</span>
                        <span class="value" id="pool-temp">—</span>
                    </div>
                    <div class="metric">
                        <span class="label">Spa</span>
                        <span class="value" id="spa-temp">—</span>
                    </div>
                    <div class="metric">
                        <span class="label">Pool set</span>
                        <span class="value" id="pool-set">—</span>
                    </div>
                    <div class="metric">
                        <span class="label">Spa set</span>
                        <span class="value" id="spa-set">—</span>
                    </div>
                </div>
            </section>
            <section class="card controls">
                <h2>Controls</h2>
                
                <div class="control-row buttons">
                    <button type="button" id="filter-on-btn">Pool</button>
                    <button type="button" id="spa-on-btn">Spa</button>
                    <button type="button" id="pool-lights-btn">Pool Lights</button>
                    <button type="button" id="spa-lights-btn">Spa Lights</button>
                    <button type="button" id="all-off-btn" class="danger">All off</button>
                </div>
                <div class="control-row">
                    <label for="spa-temp-input">Spa temp (°F)</label>
                    <input type="number" id="spa-temp-input" min="80" max="104" value="102">
                    
                </div>
                <div class="control-row">
                    <label for="pool-temp-input">Pool temp (°F)</label>
                    <input type="number" id="pool-temp-input" min="60" max="101" value="91">
                </div>
                 <div class="control-row">
                    <label for="filter-rpm-input">Filter RPM</label>
                    <input type="number" id="filter-rpm-input" min="0" max="3450" value="1200" step="50">
                </div>
            </section>

            
            <section class="card equipment">
                <h2>Equipment</h2>
                <ul class="equip-list">
                    <li>Filter pump: <strong id="filter-pump-on">—</strong></li>
                    <li>Aux / jets: <strong id="aux-state">—</strong></li>
                    <li>Heater: <strong id="heater-state">—</strong></li>
                    <li>Pool light: <strong id="pool-light-state">—</strong></li>
                    <li>Spa light: <strong id="spa-light-state">—</strong></li>
                    <li>RPM: <strong id="filter-rpm">—</strong></li>
                    <li>Watts: <strong id="filter-watts">—</strong></li>
                    <li>SWG: <strong id="swg-percent">—</strong></li>
                    <li>Salt: <strong id="salt-ppm">—</strong></li>
                </ul>
            </section>
           
            <section class="card debug-panel" id="debug-panel" style="display: none;">
                <h2>Protocol debug</h2>
                <textarea id="protocolOutput" rows="8" readonly></textarea>
                <div class="control-row buttons">
                    <button type="button" id="inject-button">Inject test RX</button>
                    <button type="button" id="send-tx-button">Send status poll</button>
                </div>
            </section>
        </main>

        <div id="error-container" class="error-message" style="display: none;"></div>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
